# format: github.com/xhanio/gopro/pkg/types/project.go

product: example # required
# model:
# version: develop
# domain:
# module: github.com/xhanio/gopro # go module path; read from go.mod when unset, so `gopro init` needs it in a new project

default:
  binary_src: build/binary
  binary_tgt: bin/
  binary_build_env:
    # - CGO_ENABLED=0
    # - GOOS=linux
    # - GOARCH=amd64
  binary_build_args:
    - -v
    - -gcflags
    - '-N -l'
    - -ldflags
    - '-s'
    # - -ldflags # a repeated -ldflags accumulates with the one above
    # - '-extldflags "-static"'
  image_build_src: build/image
  # image_build_args: # extra docker build flags; -t, -f and NAME/BASE/CONFIG_TGT/CONFIG_DIR are reserved
  #   - --platform=linux/amd64
  image_prefix: localhost:5000
  config_src: env/default/config
  config_tgt: dist/default/config
  kubernetes_src: env/default/kubernetes
  kubernetes_tgt: dist/default/kubernetes
  docker_compose_src: env/default/docker-compose
  docker_compose_tgt: dist/default

  binaries:
    - demo
  images:
    - db
    - demo
  configs:
    - demo
  kubernetes_templates:
    - demo

env:
  local:
    binary_build_env:
      - CGO_ENABLED=1

    config_src: env/local/config
    config_tgt: dist/local/config

    kubernetes_src: env/local/kubernetes
    kubernetes_tgt: dist/local/kubernetes

    docker_compose_src: env/local/docker-compose
    docker_compose_tgt: dist/local

  prod:
    binary_build_env:
      - CGO_ENABLED=0
      - GOOS=linux
      - GOARCH=amd64
    binary_build_args:
      - -v
      - -gcflags
      - '-N -l'
      - -ldflags
      - '-s'

    config_src: env/prod/config
    config_tgt: dist/prod/config

    kubernetes_src: env/prod/kubernetes
    kubernetes_tgt: dist/prod/kubernetes

build:
  binaries:
    - name: demo
      version: v1.2.3 # application's own version, defaults to the product version
      config_dir: /etc/demo
    - name: demo-cli # not listed under binaries above, so not built until it is
      build_env: # merge the binary_build_env
        - CGO_ENABLED=0
      build_args: # replace the binary_build_args
        - -v
        - -gcflags
        - '-N -l'
        - -ldflags
        - '-s'
        - -ldflags # accumulates: links with -s -extldflags "-static"
        - '-extldflags "-static"'
      platform: # deprecated: use platforms instead, still honored for now
        - darwin/arm64
        - darwin/amd64
      platforms:
        - name: linux/amd64
        - name: linux/arm64
          env: # merge the build_env
            - CC=aarch64-linux-gnu-gcc
          args: # replace the build_args
            - -v
            - -tags=netgo

  images:
    - name: db
      build_from: postgres:13.21-alpine3.21
    - name: demo
      base: ubuntu:22.04 # or $db, to build on the db image above

generate:
  configs:
    - name: demo
      files:
        - cert/*
        - migrations/*.up.sql
        - migrations/*.down.sql
        - config.json
        # secret.env needs no entry: it is never copied to the output directory,
        # even when a pattern matches it. FromSecretEnv reads it from the source,
        # beside the config files (e.g., env/default/config/demo/secret.env).
        # Keep "secret.env" in .gitignore and "**/secret.env" in .dockerignore;
        # gopro init adds both.

  kubernetes:
    - name: demo
      # files:
      #   - deployment.yaml
      #   - configmap.yaml

  docker_compose:
    files:
      - docker-compose.yaml
