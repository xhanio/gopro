# format: github.com/xhanio/gopro/pkg/types/project.go

product: example # required
# model:
# version: develop
# domain:
# module: github.com/xhanio/gopro # go module name

default:
  binary_src: build/binary
  binary_tgt: bin/
  binary_build_env:
    # - CGO_ENABLED=0
    # - GOOS=linux
    # - GOARCH=amd64
  binary_build_args:
    - -v
    - -gcflags
    - '-N -l'
    - -ldflags
    - '-s'
    # - -ldflags
    # - '-extldflags "-static"'
  image_build_src: build/image
  image_prefix: localhost:5000
  config_src: env/default/config
  config_tgt: dist/default/config
  kubernetes_src: env/default/kubernetes
  kubernetes_tgt: dist/default/kubernetes
  docker_compose_src: env/default/docker-compose
  docker_compose_tgt: dist/default

  binaries:
    - demo
  images:
    - db
    - demo
  configs:
    - demo
  kubernetes_templates:
    - demo

env:
  local:
    binary_build_env:
      - CGO_ENABLED=1

    config_src: env/local/config
    config_tgt: dist/local/config

    kubernetes_src: env/local/kubernetes
    kubernetes_tgt: dist/local/kubernetes

    docker_compose_src: env/local/docker-compose
    docker_compose_tgt: dist/local

  prod:
    binary_build_env:
      - CGO_ENABLED=0
      - GOOS=linux
      - GOARCH=amd64
    binary_build_args:
      - -v
      - -gcflags
      - '-N -l'
      - -ldflags
      - '-s'
      - -ldflags
      - '-extldflags "-static"'

    config_src: env/prod/config
    config_tgt: dist/prod/config

    kubernetes_src: env/prod/kubernetes
    kubernetes_tgt: dist/prod/kubernetes

build:
  binaries:
    - name: demo
      config_dir: /etc/demo

  images:
    - name: db
      build_from: postgres:13.21-alpine3.21
    - name: demo
      base: ubuntu:22.04 # use $img here to apply img as base

generate:
  configs:
    - name: demo
      files:
        - cert/*
        - migrations/*.up.sql
        - migrations/*.down.sql
        - config.json
        - secret.env

  kubernetes:
    - name: demo
      # files:
      #   - deployment.yaml
      #   - configmap.yaml

  docker_compose:
    files:
      - docker-compose.yaml